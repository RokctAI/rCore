      OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
      SOFTWARE.
  # Only real, hand-written source files need a header.
  paths:
    - '**/*.py'
    - '**/*.js'
    - '**/*.jsx'
    - '**/*.ts'
    - '**/*.tsx'
    - '**/*.dart'
  paths-ignore:
    # Vendored / third-party code
    - '**/node_modules/**'
    - '**/vendor/**'
    # Build output and generated code
    - '**/dist/**'
    - '**/build/**'
    - '**/.dart_tool/**'
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.gr.dart'
    - '**/*.min.js'
    # Local environments
    - '**/venv/**'
    - '**/.venv/**'
    # Agent-internal protocol state (mirrors per-repo configs)
    - '.rokct/**'
    # NOTE (deliberate): composed SDK modules are NOT excluded here,
    # because they are never committed to this repo. rCore is a bare
    # app shell — CI composes each product flavor ephemerally in the
    # workspace and discards it (.github/workflows/compose-test.yml).
    # If composed output ever reappears in the tree, this check failing
    # on it is the correct alarm: GPL/Frappe-derived composed code
    # (e.g. the crm and gateways modules) must never be MIT-stamped,
    # and must never be committed here in the first place.
